[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "optcutfreq"
dynamic = ["version"]
description = "Automatic search of optimal filter cutoff frequency based on residual analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcos Duarte", email = "duartexyz@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
keywords = ["filter", "cutoff frequency", "residual analysis", "signal processing", "biomechanics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/demotu/optcutfreq"
Documentation = "https://github.com/demotu/optcutfreq/tree/master/docs"
Issues = "https://github.com/demotu/optcutfreq/issues"

[tool.setuptools]
packages = ["optcutfreq"]

[tool.setuptools.dynamic]
version = { attr = "optcutfreq.__version__" }

[tool.pytest.ini_options]
filterwarnings = ["error::DeprecationWarning:optcutfreq", "ignore:.*non-interactive:UserWarning"]
